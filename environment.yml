# Canonical Python environment for this repo.
# Create once:  conda env create -f environment.yml
# Activate:      conda activate food-health-viz
# Update after edits: conda env update -f environment.yml --prune

name: food-health-viz
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - matplotlib
  - jupyter
  - ipykernel
  - duckdb
  - pip
  - pip:
      - requests
      - beautifulsoup4
      - lxml
      - plotly
      - streamlit
      - starlette>=0.46.0,<1.4.0  # matches streamlit's own internal constraint — pin explicitly, an unpinned resolve has landed outside this range before
      - geopy
      - python-dotenv
      - pypdf
      - sentence-transformers
      # LangChain 1.0's create_agent (native tool-calling loop) replaced the
      # old AgentExecutor/create_react_agent API, and the Groq/Chroma/
      # HuggingFace integration packages now require the langchain-core 1.x
      # line that comes with it — keep these unpinned-above-1.0 rather than
      # reintroducing the pre-1.0 pins, which are no longer mutually
      # installable with the rest.
      - langchain>=1.0
      - langchain-text-splitters>=1.0
      - langchain-ollama>=1.0
      - langchain-groq>=1.0
      - langchain-google-genai>=4.0
      - langchain-chroma>=1.0
      - langchain-huggingface>=1.0
      - chromadb>=0.5.0
